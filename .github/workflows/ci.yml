name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: the `breaking` label decides whether removing a token is allowed.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    name: Check tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Layer rules, allowed values, no install scripts
        run: npm run check

      # Products use tokens by name: removing or renaming one needs the `breaking` label, which
      # also makes the release a new major version.
      - name: Removed tokens need the breaking label
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'breaking') }}
        run: npm run -s check:removals -- "$BASE_SHA"
