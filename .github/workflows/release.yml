name: Release

# A push to main that changes core.css or semantic.css since the last release is tagged, then the
# products are told. Everything is computed from <last release>..HEAD, so a run cancelled by a newer
# push loses nothing: the next run covers its changes.
# Version: minor bump; major if a token was removed or renamed since the last release (CI already
# requires the `breaking` label on such PRs; this doesn't depend on the label).

on:
  push:
    branches: [main]

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check before tagging
        run: npm test && npm run check

      - name: Next version
        id: version
        run: |
          # Releases only: vX.Y.Z, nothing like v2.0.0-rc.1.
          last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -n "$last" ] && git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "HEAD is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$last" ]; then
            next=v1.0.0
          elif git diff --quiet "$last" HEAD -- core.css semantic.css; then
            echo "No token file changed since $last; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          else
            IFS=. read -r major minor _ <<< "${last#v}"
            if BREAKING=false node scripts/check-removals.mjs "$last" > /dev/null 2>&1; then
              next="v${major}.$((minor + 1)).0"
            else
              echo "Tokens were removed or renamed since $last: major version."
              next="v$((major + 1)).0.0"
            fi
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "Releasing $next (after ${last:-nothing})"

      # A short-lived token from the sefaria-design-system GitHub App (org variable
      # DESIGN_SYSTEM_APP_ID, org secret DESIGN_SYSTEM_APP_PRIVATE_KEY); GITHUB_TOKEN only reaches this repo.
      # Before tagging, so a missing or uninstalled app fails the run without publishing a release
      # the products never hear about.
      - name: Get the design-system app's token
        if: steps.version.outputs.release == 'true'
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DESIGN_SYSTEM_APP_ID }}
          private-key: ${{ secrets.DESIGN_SYSTEM_APP_PRIVATE_KEY }}
          owner: Sefaria
          repositories: ai-chatbot,Sefaria-Project
          permission-contents: write  # repository_dispatch needs nothing else

      - name: Tag and publish the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

      # Each product opens or updates its "update to vX" PR (see their design-system workflows).
      - name: Tell the products
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          for repo in ai-chatbot Sefaria-Project; do
            gh api "repos/Sefaria/$repo/dispatches" \
              -f event_type=design-system-release \
              -f "client_payload[tag]=${{ steps.version.outputs.tag }}"
          done
